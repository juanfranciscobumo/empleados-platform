name: Cypress API Tests

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run cypress:run:api

      - name: Upload mochawesome reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report-node-${{ matrix.node-version }}
          path: cypress/reports/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results-node-${{ matrix.node-version }}
          path: |
            cypress/screenshots
            cypress/videos
          retention-days: 7

  report:
    needs: test
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install report dependencies
        run: npm ci

      - name: Download all mochawesome reports
        uses: actions/download-artifact@v4
        with:
          pattern: mochawesome-report-*
          path: all-reports
          merge-multiple: true

      - name: Merge and generate HTML report
        run: |
          mkdir -p cypress/reports
          npx mochawesome-merge "all-reports/*.json" > cypress/reports/merged-report.json
          npx marge cypress/reports/merged-report.json --reportDir report --overwrite
          cp report/merged-report.html report/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
