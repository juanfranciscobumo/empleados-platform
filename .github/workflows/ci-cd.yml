name: Employee Platform CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: juanfranciscobumo/empleados
  EC2_HOST: admin@ec2-3-83-67-172.compute-1.amazonaws.com
  NODE_VERSION: '20'

jobs:
  # Job 1: Build API
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build API
        working-directory: api/Empleados
        run: ./gradlew clean build

      - name: Upload API JAR
        uses: actions/upload-artifact@v4
        with:
          name: api-jar
          path: api/Empleados/build/libs/empleados-0.0.1-SNAPSHOT.jar

  # Job 2: API Tests with Serenity-JS
  test-api-serenity:
    name: API Tests (Serenity-JS)
    runs-on: ubuntu-latest
    needs: build-api
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: empleados
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download API JAR
        uses: actions/download-artifact@v4
        with:
          name: api-jar

      - name: Start API
        run: |
          java -jar empleados-0.0.1-SNAPSHOT.jar &
          sleep 15
          curl -f http://localhost:8081/employees || exit 1

      - name: Install Serenity-JS dependencies
        working-directory: api/empleados-api-tests
        run: npm ci

      - name: Run API Tests
        working-directory: api/empleados-api-tests
        run: npm test

      - name: Upload Serenity Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-api-report
          path: api/empleados-api-tests/target/site/serenity/

  # Job 3: Frontend Tests with Serenity-JS
  test-frontend-serenity:
    name: Frontend Tests (Serenity-JS + Playwright)
    runs-on: ubuntu-latest
    needs: build-api
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: empleados
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download API JAR
        uses: actions/download-artifact@v4
        with:
          name: api-jar

      - name: Start API
        run: |
          java -jar empleados-0.0.1-SNAPSHOT.jar &
          sleep 15
          curl -f http://localhost:8081/employees || exit 1

      - name: Start Frontend
        run: |
          cd web/empleados-frontend
          npx serve . -p 80 &

      - name: Install Serenity-JS dependencies
        working-directory: web/empleados-frontend-tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web/empleados-frontend-tests
        run: npx playwright install --with-deps chromium

      - name: Run Frontend Tests
        working-directory: web/empleados-frontend-tests
        run: npm test

      - name: Upload Serenity Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-frontend-report
          path: web/empleados-frontend-tests/target/site/serenity/

  # Job 4: Performance Tests with k6
  test-performance:
    name: Performance Tests (k6)
    runs-on: ubuntu-latest
    needs: build-api
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: empleados
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download API JAR
        uses: actions/download-artifact@v4
        with:
          name: api-jar

      - name: Start API
        run: |
          java -jar empleados-0.0.1-SNAPSHOT.jar &
          sleep 15
          curl -f http://localhost:8081/employees || exit 1

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D68
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run k6 Tests
        run: |
          k6 run api/k6-empleados/employees-crud.js

  # Job 5: Deploy to EC2
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build-api, test-api-serenity, test-frontend-serenity, test-performance]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download API JAR
        uses: actions/download-artifact@v4
        with:
          name: api-jar

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: admin
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull and restart API container
            docker pull ${{ env.DOCKER_IMAGE }}:latest
            docker ps -q -f name=empleados | xargs -r docker stop
            docker ps -a -q -f name=empleados | xargs -r docker rm
            docker run -d -p 8081:8081 --name empleados ${{ env.DOCKER_IMAGE }}:latest

  # Job 6: Deploy Frontend to GitHub Pages
  deploy-frontend:
    name: Deploy Frontend to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test-api-serenity, test-frontend-serenity]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/empleados-frontend/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
