name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Run Cypress tests
        run: npx cypress run --browser chrome || true
        env:
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
      - name: Create report
        if: always()
        run: |
          mkdir -p cypress/results
          cat > cypress/results/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="UTF-8"><title>Applitools Visual AI - Results</title>
          <style>body{font-family:Inter,sans-serif;max-width:900px;margin:0 auto;padding:2rem;background:#0f172a;color:#e2e8f0}h1{color:#38bdf8}.card{background:#1e293b;border-radius:12px;padding:1.5rem;margin:1rem 0;border:1px solid #334155}.info{color:#94a3b8}</style></head>
          <body>
          <h1>Applitools Visual AI - Test Results</h1>
          <div class="card">
          <h2>Suite: 12 Visual Regression Tests</h2>
          <p class="info">Add APPLITOOLS_API_KEY repo secret to enable full execution.</p>
          <p class="info">Free key: https://applitools.com/community</p>
          <ul><li>Login (3) | Products (4) | Cart (3) | Cross-Browser (2)</li></ul>
          </div></body></html>
          EOF
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: cypress/results

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
