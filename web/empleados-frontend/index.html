<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Empleados</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-users"></i> Gestión de Empleados</h1>
            <p class="subtitle">API REST - Spring Boot</p>
        </header>

        <div class="api-status" id="apiStatus">
            <span class="status-dot"></span>
            <span class="status-text">Verificando API...</span>
        </div>

        <div class="card form-card">
            <h2><i class="fas fa-user-plus"></i> <span id="formTitle">Agregar Empleado</span></h2>
            <form id="employeeForm">
                <input type="hidden" id="employeeId">
                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" placeholder="Ej: Juan Pérez" required>
                </div>
                <div class="form-group">
                    <label for="role">Rol</label>
                    <input type="text" id="role" placeholder="Ej: Desarrollador" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                    <button type="button" class="btn btn-secondary" id="cancelBtn" style="display:none;">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2><i class="fas fa-list"></i> Lista de Empleados</h2>
            <div class="table-container">
                <table id="employeeTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Rol</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="employeeTableBody">
                        <tr>
                            <td colspan="4" class="loading">Cargando empleados...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="stats" id="stats"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
